[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosting"
version = "1.0.0"
description = "Imputación de jugadores fuera de cámara en fútbol a partir de tracking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7"]

[project.optional-dependencies]
data = ["kloppy>=3.16"]
model = ["torch>=2.2"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
